name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only ever reads the repository: it builds, tests and lints. Nothing here
# publishes, comments or tags, so the token gets nothing beyond checkout.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs first. Every other job needs it, so a pull request with any open SpecSync
  # change under .specsync/changes/ runs nothing else until the change is archived.
  archive-gate:
    name: Archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The archive gate inputs are newer than v6.1.1, which ignores them.
      - uses: CorvidLabs/spec-sync@106aaa43d0bcf049f19b173ddb63815a25c3f931 # main, archive gate (#832)
        with:
          archive-gate-only: 'true'

  check:
    name: Check
    needs: archive-gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test

  # The page's behavior, as opposed to the HTML it is generated from. Every
  # other view test asserts on what goes in; two bugs shipped anyway, and both
  # were found by a person taking a screenshot. ubuntu-latest ships Chrome.
  view:
    name: The page in a browser
    needs: archive-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Chrome is present
        run: |
          command -v google-chrome || command -v chromium-browser || command -v chromium
      - run: sh scripts/view-behaves.sh
      # The fledge lifecycle hook, driven the way fledge drives it. cargo test
      # covers the same ground, but this is the script fledge actually execs.
      - run: sh scripts/nudge-behaves.sh

  lint:
    name: Lint
    needs: archive-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  specsync:
    name: SpecSync lifecycle
    needs: archive-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: CorvidLabs/spec-sync@e8fd149d4d9e7b8df9ea1d40d446df67da13f2fa # v6.1.1
        with:
          version: "6.1.1"
          strict: "true"
      - name: Lifecycle regression controls
        run: bash scripts/test-specsync-lifecycle.sh
      - name: Lifecycle and archive readiness
        if: always()
        run: bash scripts/check-specsync-lifecycle.sh
