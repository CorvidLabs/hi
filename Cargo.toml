[package]
name = "human-intent"
version = "0.3.2"
edition = "2024"
description = "Human Intent; acceptance criteria in human words, with permanent ids"
license = "MIT"
authors = ["CorvidLabs"]
repository = "https://github.com/CorvidLabs/hi"
readme = "README.md"
keywords = ["acceptance-criteria", "requirements", "sdd", "agents", "intent"]
categories = ["development-tools", "command-line-utilities"]

# Keep the published crate to what someone installing the binary needs.
# The specs alone are 550KB and exist for this repository, not for consumers.
exclude = [
    "specs/",
    "docs/",
    ".specsync/",
    ".fledge/",
    ".github/",
    "intent.html",
]

# `hi` is taken on crates.io (library-only, no binaries), so the crate is
# `human-intent` and the command is `hi`. See DECISIONS.md §7.
[[bin]]
name = "hi"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
